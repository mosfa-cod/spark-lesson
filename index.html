<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دروس مستر سبارك</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>مرحباً بطلاب مستر سبارك</h1>
    <table id="lessonTable">
        <thead>
            <tr>
                <th>اسم الدرس</th>
                <th>الكلمة (English)</th>
                <th>المعنى (العربية)</th>
                <th>الجملة التعليمية</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        fetch('lessons.csv')
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                const tbody = document.querySelector('#lessonTable tbody');
                rows.slice(1).forEach(row => {
                    const cols = row.split(',');
                    if (cols.length > 1) {
                        const tr = document.createElement('tr');
                        cols.forEach(col => {
                            const td = document.createElement('td');
                            td.textContent = col;
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    }
                });
            });
    </script>
</body>
</html>
