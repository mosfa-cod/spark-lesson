 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دروس مستر مبارك</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>
    <h1>دروس مستر مبارك التفاعلية</h1>
    <table id="lessonTable">
        <thead>
            <tr>
                <th>اسم الدرس</th>
                <th>الكلمة</th>
                <th>المعنى</th>
                <th>الجملة</th>
                <th>الصورة</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
 <script>
    fetch('lessons.csv')
        .then(res => res.text())
        .then(data => {
            const rows = data.split('\n');
            const tbody = document.querySelector('#lessonTable tbody');
            tbody.innerHTML = '';
            
            rows.slice(1).forEach(row => {
                if (row.trim() === '') return;
                // هذا السطر هو الأهم، سيقسم السطر بفاصلة وسيزيل أي مسافات
                const cols = row.split(',').map(c => c.trim());
                
                if (cols.length >= 5) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${cols[0]}</td>
                        <td>${cols[1]}</td>
                        <td>${cols[2]}</td>
                        <td>${cols[3]}</td>
                        <td><img src="${cols[4]}" alt="صورة" style="width:100px;"></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        });
</script>
</body>
</html>
