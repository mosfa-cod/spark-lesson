 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروس مستر مبارك التفاعلية</title>

<style>
body{
    font-family:Tahoma,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#333;
}

.search-container{
    text-align:center;
    margin:20px 0;
}

#searchInput{
    width:60%;
    padding:12px;
    border:2px solid #4CAF50;
    border-radius:25px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#4CAF50;
    color:white;
}

img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
}

.speak-btn{
    background:#2196F3;
    color:white;
    border:none;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
}

.speak-btn:hover{
    background:#1976D2;
}
</style>
</head>

<body>

<h1>دروس مستر مبارك التفاعلية</h1>

<div class="search-container">
    <input
    type="text"
    id="searchInput"
    placeholder="ابحث عن كلمة أو معنى أو جملة">
</div>

<table id="lessonTable">
<thead>
<tr>
<th>اسم الدرس</th>
<th>الكلمة</th>
<th>المعنى</th>
<th>الجملة</th>
<th>الصورة</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

let allRowsData=[];

const backupImages = [
    "https://picsum.photos/200/200?random=1",
    "https://picsum.photos/200/200?random=2",
    "https://picsum.photos/200/200?random=3",
    "https://picsum.photos/200/200?random=4",
    "https://picsum.photos/200/200?random=5",
    "https://picsum.photos/200/200?random=6"
];

fetch('lessons.csv')
.then(response => response.text())
.then(data => {

    const rows = data.trim().split(/\r?\n/);

    allRowsData = rows.slice(1);

    renderTable(allRowsData);

})
.catch(error => console.error(error));

function renderTable(rows){

    const tbody = document.querySelector('#lessonTable tbody');

    tbody.innerHTML='';

    rows.forEach((row,index)=>{

        const cols = row.split(',');

        if(cols.length >= 4){

            const lessonName = cols[0];
            const word = cols[1];
            const meaning = cols[2];
            const sentence = cols[3];

            const imageUrl = backupImages[index % backupImages.length];

            const tr = document.createElement('tr');

            tr.innerHTML = `
            <td>${lessonName}</td>

            <td>
                ${word}
                <button class="speak-btn"
                onclick="speakText('${word}')">🔊</button>
            </td>

            <td>${meaning}</td>

            <td>
                ${sentence}
                <button class="speak-btn"
                onclick="speakText('${sentence}')">🔊</button>
            </td>

            <td>
                <img src="${imageUrl}" alt="صورة">
            </td>
            `;

            tbody.appendChild(tr);
        }

    });

}

function speakText(text){

    if('speechSynthesis' in window){

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = 'en-US';

        speech.rate = 0.9;

        window.speechSynthesis.speak(speech);
    }
}

document.getElementById('searchInput')
.addEventListener('input',function(){

    const value = this.value.toLowerCase();

    const filtered = allRowsData.filter(row =>
        row.toLowerCase().includes(value)
    );

    renderTable(filtered);

});

</script>

</body>
</html>
