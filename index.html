<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دروس مستر مبارك</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>دروس مستر مبارك التفاعلية</h1>
    
    <table id="lessonTable">
        <thead>
            <tr>
                <th>اسم الدرس</th>
                <th>الكلمة</th>
                <th>المعنى</th>
                <th>الجملة</th>
                <th>الصورة</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        fetch('lessons.csv')
            .then(res => res.text())
            .then(data => {
                const rows = data.split('\n');
                const tbody = document.querySelector('#lessonTable tbody');
                tbody.innerHTML = '';
                
                rows.slice(1).forEach(row => {
                    if (row.trim() === '') return;
                    // تم التعديل هنا ليطابق الفاصل | الموجود في ملفك
                    const cols = row.split('|');
                    
                    if (cols.length >= 5) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${cols[0]}</td>
                            <td>${cols[1]}</td>
                            <td>${cols[2]}</td>
                            <td>${cols[3]}</td>
                            <td><img src="${cols[4].trim()}" alt="صورة"></td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
            });
    </script>
</body>
</html>
